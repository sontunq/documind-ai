[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-backend"
version = "0.1.0"
description = "DocuMind AI document ingestion backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "pillow>=12,<13",
  "pypdf>=6.9,<7",
  "pypdfium2==5.13.0",
  "paddleocr==3.3.3",
  "paddlepaddle==3.2.2",
  "paddlex==3.3.13",
  "numpy==2.2.6",
  "opencv-contrib-python==4.10.0.84",
  "scikit-learn==1.7.2",
  "joblib==1.6.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database",
  "real_ocr: opt-in CPU adapter smoke test; requires RUN_REAL_OCR=1 and official model downloads",
]
